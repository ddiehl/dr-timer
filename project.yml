name: DRTimer
options:
  bundleIdPrefix: com.spartatechnology
  deploymentTarget:
    iOS: "17.0"
packages:
  DRCore:
    path: DRCore
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  DRTimer:
    type: application
    platform: iOS
    sources: [DRTimer]
    dependencies:
      - package: DRCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spartatechnology.drtimer
        DEVELOPMENT_TEAM: 675JQKFZ8G
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: DRTimer/Info.plist
      properties:
        CFBundleDisplayName: Dead Reckon Timer
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Lets the app keep running (and start the time-up alert) while a leg
        # counts down with the phone locked. Local notifications need no plist key.
        UIBackgroundModes:
          - audio
  DRTimerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DRTimerTests]
    dependencies:
      - target: DRTimer
      - package: DRCore
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DRTimer:
    build:
      targets:
        DRTimer: all
        DRTimerTests: [test]
    test:
      targets: [DRTimerTests]
